<!DOCTYPE html>
<html class="no-js" lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Git Server</title>
        <meta name="description" content="This is a box engraving app.">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <script type="text/html" id="about-template">

        <script type="text/html" id="3d-template">
          <h3>
            Box engraving
          </h3>
          <div id="laserbox"></div>
          <button class="holeModal">Round Holes</button>
          <button class="rectangularModal">Rectangular Holes</button>
          <button class="textModal">Engrave Text</button>
          <!-- Modal -->
          <div class="modal" id="modalRound">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add a round hole</h4>
                </div>
                <div class="modal-body">
                  Face: <select id="faceHole">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="30" id="XHole"><br>
                  Y (mm): <input type="number" value="30" id="YHole"><br>
                  Diameter (mm): <input type="number" value="30" id="D">
                </div>
                <div class="modal-footer">
                  <button class="hole">Add</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalRectangular">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add a rectangular hole</h4>
                </div>
                <div class="modal-body">
                  Face: <select id="faceRect">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="30" id="XRect"><br>
                  Y (mm): <input type="number" value="30" id="YRect"><br>
                  Width (mm): <input type="number" value="30" id="W"><br>
                  Height (mm): <input type="number" value="30" id="H">
                </div>
                <div class="modal-footer">
                  <button class="rectangular">Add</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalText">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add text</h4>
                </div>
                <div class="modal-body">
                  Face: <select id="faceText">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="30" id="XText"><br>
                  Y (mm): <input type="number" value="30" id="YText"><br>
                  Text: <input type="text" placeholder="text" id="T">
                </div>
                <div class="modal-footer">
                  <button class="text">Add</button>
                </div>
              </div>
            </div>
          </div>
          <script src="laserbox.js"></script>
        </script>

        <script type="text/html" id="header-template">
            <ul class="nav nav-tabs" style="font-size:1.5em">

          <p>
            Tips, suggestions, complaints or questions? Please <a href="mailto:xuyi_wang@hotmail.com">give us feedback</a>

        <script type="text/html" id="help-template">
          <h3>Q & A</h3>
          <strong><p>How can I add a hole?</p></strong>
          <p>You can add a hole by clicking on Hole button.</p>
          <strong><p>How can I add a text?</p></strong>
          <p>You can add a text field by click on Text button.</p>
        </script>

        <script type="text/html" id="2d-template">
          <h3>2D view</h3>
          <canvas id="2D" width="800" height="600"></canvas><br>
          <button class="format">Size</button>
          <button class="material">Material</button>
          <button class="shape">Shape</button>
          <button class="image">Image</button>
          <!-- Modal -->
          <div class="modal" id="modalSize">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change size</h4>
                </div>
                <div class="modal-body">
                  Width (mm): <input type="number" value="60" id="XHole"><br>
                  Height (mm): <input type="number" value="60" id="YHole">
                </div>
                <div class="modal-footer">
                  <button class="size">OK</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalMaterial">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change material</h4>
                </div>
                <div class="modal-body">
                  <select id="faceMaterial">
                    <option value="front">Grenen 6mm</option>
                    <option value="back">Elk 6mm</option>
                    <option value="left">Vuren 9mm</option>
                    <option value="right">Parline 4mm</option>
                  </select>
                </div>
                <div class="modal-footer">
                  <button class="thickness">OK</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalShape">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change shape</h4>
                </div>
                <div class="modal-body">
                  <select id="faceShape">
                    <option value="front">Rechte hoeken</option>
                    <option value="back">Ronde hoeken</option>
                  </select>
                </div>
                <div class="modal-footer">
                  <button class="corn">OK</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalImage">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add image</h4>
                </div>
                <div class="modal-body">
                  <input type="file" id="image" accept="image/*">
                </div>
                <div class="modal-footer">
                  <button class="surface">OK</button>
                </div>
              </div>
            </div>
          </div>
        </script>
    </head>
    <body>
      <div class="hidden">
        <canvas id="canvasTop" width="64" height="64"></canvas>
        <canvas id="canvasLeft" width="64" height="64"></canvas>
        <canvas id="canvasFront" width="64" height="64"></canvas>
        <canvas id="canvasRight" width="64" height="64"></canvas>
        <canvas id="canvasBottom" width="64" height="64"></canvas>
        <canvas id="canvasBack" width="64" height="64"></canvas>
      </div>
      <main id="content" class="container" role="main"></main>
      <script>
        var ctx = document.getElementById("canvasTop").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
        ctx = document.getElementById("canvasLeft").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
        ctx = document.getElementById("canvasFront").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
        ctx = document.getElementById("canvasRight").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
        ctx = document.getElementById("canvasBottom").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
        ctx = document.getElementById("canvasBack").getContext("2d")
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 64, 64);
      </script>
      <script src="vendor/jquery.js"></script>
      <script src="vendor/underscore.js"></script>
      <script src="vendor/backbone.js"></script>
      <script src="vendor/three.min.js"></script>
      <script src="vendor/OrbitControls.js"></script>
      <script src="vendor/Projector.js"></script>
      <script id="config" type="text/json">
        {
          "models": {},
          "collections": {},
          "views": {},
          "router": null
        }
      </script>
      <script src="app.js"></script>
      <script src="models.js"></script>
      <script src="views.js"></script>
      <script src="router.js"></script>
    </body>
</html>
