<!DOCTYPE html>
<html class="no-js" lang="en">
    <head>
        <meta charset="utf-8">

        <link rel="stylesheet" href="css/bootstrap.min.css">
        <script type="text/html" id="about-template">

        <script type="text/html" id="home-template">
          <h3>
            You can use this app to engrave a box.
          </h3>
          <div id="laserbox"></div>
          <button class="add">Round Holes</button>
          <button class="rectangularModal">Rectangular Holes</button>
          <button class="textModal">Engrave Text</button>
          <canvas id="canvasFront" style="display:none"></canvas>
          <canvas id="canvasBack" style="display:none"></canvas>
          <canvas id="canvasLeft" style="display:none"></canvas>
          <canvas id="canvasRight" style="display:none"></canvas>
          <canvas id="canvasBottom" style="display:none"></canvas>
          <canvas id="canvasTop" style="display:none"></canvas>
          <!-- Modal -->
          <div class="modal" id="modal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add a round hole</h4>
                </div>
                <div class="modal-body">
                  <select id="faceHole">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="100" id="XHole"></input><br>
                  Y (mm): <input type="number" value="100" id="YHole"></input><br>
                  Diameter (mm): <input type="number" value="50" id="D"></input>
                </div>
                <div class="modal-footer">
                  <button class="hole">Add</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalRectangular">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add a rectangular hole</h4>
                </div>
                <div class="modal-body">
                  <select id="faceRect">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="100" id="XRect"></input><br>
                  Y (mm): <input type="number" value="100" id="YRect"></input><br>
                  Width (mm): <input type="number" value="50" id="W"></input><br>
                  Hight (mm): <input type="number" value="50" id="H"></input>
                </div>
                <div class="modal-footer">
                  <button class="rectangular">Add</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalText">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Add text</h4>
                </div>
                <div class="modal-body">
                  <select id="faceText">
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                  </select><br>
                  X (mm): <input type="number" value="100" id="XText"></input><br>
                  Y (mm): <input type="number" value="100" id="YText"></input><br>
                  Text: <input type="text" value="text" id="T"></input>
                </div>
                <div class="modal-footer">
                  <button class="text">Add</button>
                </div>
              </div>
            </div>
          </div>
          <script src="laserbox.js"></script>
        </script>

        <script type="text/html" id="help-template">
          <h3>Q & A</h3>
          <strong><p>How can I add an topic?</p></strong>
          <p>You can add an topic by clicking on Add An Topic button.</p>
          <strong><p>How can I react on an topic?</p></strong>
          <p>You can react on an topic by clicking on Reply button after clicking the topic.</p>
        </script>

        <script type="text/html" id="2d-template">
          <h3>2D</h3>
          <button class="format">Format</button><button class="material">Material</button><button class="shape">Shape</button><br>
          <canvas id="myCanvas" width="600" height="400"></canvas>
          <!-- Modal -->
          <div class="modal" id="modal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change format</h4>
                </div>
                <div class="modal-body">
                  X (mm): <input type="number" value="100" id="XHole"></input><br>
                  Y (mm): <input type="number" value="100" id="YHole"></input>
                </div>
                <div class="modal-footer">
                  <button class="hole">OK</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalRectangular">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change material</h4>
                </div>
                <div class="modal-body">
                  <select id="faceRect">
                    <option value="front">Grenen 6mm</option>
                    <option value="back">Elk 6mm</option>
                    <option value="left">Vuren 9mm</option>
                    <option value="right">Parline 4mm</option>
                  </select>
                </div>
                <div class="modal-footer">
                  <button class="rectangular">OK</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal" id="modalText">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                  </button>
                  <h4 class="modal-title" id="modal-label">Change shape</h4>
                </div>
                <div class="modal-body">
                  <select id="faceText">
                    <option value="front">Rechte hoeken</option>
                    <option value="back">Ronde hoeken</option>
                  </select>
                </div>
                <div class="modal-footer">
                  <button class="text">OK</button>
                </div>
              </div>
            </div>
          </div>
        </script>

        <script type="text/html" id="new-item-template">
          <form action="" method="post">
            <label for="id_title">Title:</label>
            <input class="form-control" id="id_title" type="text" name="title" maxlength="100" required="true" />
            <label for="id_description">Description:</label>
            <textarea class="form-control" id="id_description" name="description" cols="50" required="true"></textarea>
            <br>
            <button type="submit" class="btn btn-success">Create</button>
            <button class="cancel btn btn-danger">Cancel</button>
          </form>
        </script>

        <script type="text/html" id="new-message-template">
          <form action="" method="post">
            <label for="id_text">Message:</label>
            <textarea class="form-control" id="id_text" name="text" cols="50" required="true"></textarea>
            <input type="hidden" name="item" value="http://localhost:8000/api/items/<%=item.get('id')%>">
            <br>
            <button type="submit" class="btn btn-success">Create</button>
            <button class="cancel btn btn-danger">Cancel</button>
          </form>
        </script>

        <script type="text/html" id="item-template">
          <h3 dir="ltr"><%=item.get('title')%></h3>
          <input type="hidden" name="id" value="<%=item.get('id')%>">
          <p class="desc" dir="ltr">
            <%=_.escape(item.get('description'))%>
          </p>
          <% _.each(messages.models, function (message) { %>
            <p>
              <%=message.getDatetime()%>: <%=_.escape(message.get('text'))%>
            </p>
          <% }); %>
          <button class="add btn btn-primary">Reply</button>
        </script>
    </head>
    <body>
      <main id="content" class="container" role="main"></main>
      <script src="vendor/jquery.js"></script>
      <script src="vendor/underscore.js"></script>
      <script src="vendor/backbone.js"></script>
      <script src="vendor/three.min.js"></script>
      <script src="vendor/OrbitControls.js"></script>
      <script src="vendor/Projector.js"></script>
      <script id="config" type="text/json">
        {
          "models": {},
          "collections": {},
          "views": {},
          "router": null
        }
      </script>
      <script src="app.js"></script>
      <script src="models.js"></script>
      <script src="views.js"></script>
      <script src="router.js"></script>
    </body>
</html>
